{% extends "base.html" %}
{% block title %}{{ simbolo }}{% endblock %}
{% block content %}
<a href="{{ url_for('dashboard') }}" class="back-link">← Volver a tenencias</a>
<h1>{{ simbolo }}</h1>
<p class="subtitle">Evolución del precio de cierre.</p>

<div class="card">
  <div class="inline-form" style="margin-bottom: 16px;">
    <button class="secondary" onclick="cargar(30)">30 días</button>
    <button class="secondary" onclick="cargar(90)">90 días</button>
    <button class="secondary" onclick="cargar(365)">1 año</button>
  </div>
  <canvas id="grafico" height="90"></canvas>
  <p id="mensaje-error" style="color: var(--negative); font-size: 13px; display: none;"></p>
</div>

<script src="{{ url_for('static', filename='js/chart.umd.js') }}"></script>
<script>
const simbolo = {{ simbolo|tojson }};
const mercado = {{ mercado|tojson }};
let chart = null;

async function cargar(dias) {
  const errorEl = document.getElementById('mensaje-error');
  errorEl.style.display = 'none';
  try {
    const resp = await fetch(`/api/historico/${simbolo}?mercado=${mercado}&dias=${dias}`);
    const data = await resp.json();
    if (!data.ok) {
      errorEl.textContent = data.error;
      errorEl.style.display = 'block';
      return;
    }
    const labels = data.puntos.map(p => p.fecha);
    const valores = data.puntos.map(p => p.cierre);

    if (chart) chart.destroy();
    const ctx = document.getElementById('grafico').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: simbolo,
          data: valores,
          borderColor: '#4C8BF5',
          backgroundColor: 'rgba(76,139,245,0.08)',
          fill: true,
          pointRadius: 0,
          tension: 0.15,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8A969C', maxTicksLimit: 8 }, grid: { color: '#262E33' } },
          y: { ticks: { color: '#8A969C' }, grid: { color: '#262E33' } },
        }
      }
    });
  } catch (e) {
    errorEl.textContent = 'No se pudo cargar el histórico: ' + e;
    errorEl.style.display = 'block';
  }
}

cargar(90);
</script>
{% endblock %}
